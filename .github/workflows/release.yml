name: Publish Infernux Release

on:
  workflow_dispatch:
    inputs:
      sign_windows_release:
        description: Request SignPath signing (requires approved service and signing token)
        required: true
        type: boolean
        default: false
      replace_existing_release:
        description: Recover an unpublished draft; published Hub changes require a new project.version
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pages: write

jobs:
  build-test-publish:
    uses: ./.github/workflows/ci.yml
    with:
      publish_release: true
      sign_windows_release: ${{ inputs.sign_windows_release }}
      replace_existing_release: ${{ inputs.replace_existing_release }}
    secrets: inherit
