name: Upload verified Hub release assets

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Frozen Hub source commit
        required: true
        type: string
      validation_run:
        description: Successful Desktop Release And Tests run for that source
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-hub-assets
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      VALIDATION_RUN: ${{ inputs.validation_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Upload the already verified object-channel binaries to the matching draft
        shell: python
        run: |
          import json, os, re, subprocess, sys, urllib.request
          from pathlib import Path

          sys.path[:0] = ['packaging', 'scripts/release']
          from hub_release import project_version, project_hub_version, project_hub_build_number, release_tag_for
          from publish_hub_objects import release_assets

          repository = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/{path}']))

          source = os.environ['SOURCE_SHA']
          run_id = os.environ['VALIDATION_RUN']
          assert re.fullmatch(r'[0-9a-f]{40}', source) and run_id.isdecimal()
          run = api(f'actions/runs/{run_id}')
          assert run['head_sha'] == source and run['conclusion'] == 'success'
          assert run['path'] == '.github/workflows/ci.yml'
          jobs = api(f'actions/runs/{run_id}/jobs?per_page=100')['jobs']
          required = {'Python correctness', 'Portable Hub regressions (windows-2022)', 'Portable Hub regressions (ubuntu-22.04)'}
          assert required <= {job['name'] for job in jobs if job['conclusion'] == 'success'}

          version, hub = project_version(), project_hub_version()
          build = project_hub_build_number()
          tag = 'hub-' + release_tag_for(version, build)
          release = api(f'releases/tags/{tag}')
          assert release['draft'] and release['target_commitish'] == source
          existing = {asset['name']: asset for asset in release['assets']}
          destination = Path(os.environ['RUNNER_TEMP']) / 'hub-release'
          destination.mkdir()
          missing = []
          for name in release_assets(hub):
              url = f'https://downloads.infernux-engine.com/hub/{version}/build-{build}/{name}'
              request = urllib.request.Request(url, method='HEAD')
              with urllib.request.urlopen(request, timeout=30) as response:
                  size = int(response.headers['Content-Length'])
              if name in existing:
                  assert existing[name]['state'] == 'uploaded' and existing[name]['size'] == size
                  continue
              target = destination / name
              urllib.request.urlretrieve(url, target)
              assert target.stat().st_size == size
              missing.append(str(target))
          if missing:
              subprocess.run(['gh', 'release', 'upload', tag, *missing, '--repo', repository], check=True)
          uploaded = api(f'releases/{release["id"]}')['assets']
          assert {asset['name'] for asset in uploaded if asset['state'] == 'uploaded'} == set(release_assets(hub))
          print(f'{tag}: all six Hub assets uploaded; the release remains a draft.')
